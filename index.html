<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lagoon — Mermaid editor that fixes itself</title>
    <meta name="description" content="Live Mermaid diagram editor with human-readable error explanations and parser-verified auto-fix. Free, no account, no API key." />
    <meta name="theme-color" content="#090c10" />
    <meta property="og:title" content="Lagoon — Mermaid editor that fixes itself" />
    <meta property="og:description" content="Live rendering, plain-language error explanations and one-click auto-fix for Mermaid diagrams. No account, no API key." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lagoon-mermaid.vercel.app/" />
    <meta property="og:image" content="https://lagoon-mermaid.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lagoon-mermaid.vercel.app/og.png" />
    <link rel="canonical" href="https://lagoon-mermaid.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('lagoon:prefs') || '{}')
        var dark = p.appTheme ? p.appTheme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) { document.documentElement.classList.add('dark') }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
